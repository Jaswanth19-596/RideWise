server {
    listen 80;
    server_name ridewise.live www.ridewise.live;
    root /usr/share/nginx/html;

    # Keep this for certificate renewals
    location ~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ridewise.live www.ridewise.live;
    root /usr/share/nginx/html;
    index index.html;

    # SSL Certificate paths
    ssl_certificate /etc/letsencrypt/live/ridewise.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ridewise.live/privkey.pem;

    # SSL configuration (recommended settings)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Serve React app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}