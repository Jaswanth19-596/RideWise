server {
    listen 80;
    server_name ridewise.live www.ridewise.live;

    location ~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ridewise.live www.ridewise.live;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ridewise.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ridewise.live/privkey.pem;

    # API calls to backend
    
    location /api/ {
        proxy_pass http://ridewise-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}