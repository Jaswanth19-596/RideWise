stages:
  data_ingestion:
    cmd: python ridewise/data_ingestion.py
    deps:
      - ridewise/data_ingestion.py
    params:
      - data_ingestion

  data_preprocessing:
    cmd: python ridewise/data_preprocessing.py
    deps:
      - ridewise/data_preprocessing.py
    params:
      - data_preprocessing
    outs:
      - data/processed/data.csv
      - models/kmeans.joblib
      - models/scaler.joblib
  feature_engineering:
    cmd: python ridewise/feature_engineering.py
    deps:
      - data/processed/data.csv
      - ridewise/feature_engineering.py
    params:
      - feature_engineering
    outs:
      - data/processed/test.csv
      - data/processed/train.csv
  model_training:
    cmd: python ridewise/model_training.py
    deps:
      - ridewise/model_training.py
      - data/processed/test.csv
      - data/processed/train.csv
    params:
      - model_training
    outs:
      - models/model.joblib
      - models/encoder.joblib
