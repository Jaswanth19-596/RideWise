name: Continuous Integration

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Copy code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.13.3'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: us-east-2
      - name: Pull the Data
        run: |
          dvc pull

      - name: Run Tests
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pytest

      - name: Promote Model
        if: success()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python ridewise/promote_model.py

  push_to_ecr:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Copy Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{secrets.AWS_ECR_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_ECR_SECRET_ACCESS_KEY}}
          aws-region: us-east-2
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Retrieve an authentication token
        run: |
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 740186513331.dkr.ecr.us-east-2.amazonaws.com

      - name: Build and tag the Docker image
        run: |
          docker build -t ridewise/production/backend ./backend/
          docker build -t ridewise/production/frontend ./frontend/
          docker tag ridewise/production/backend:latest 740186513331.dkr.ecr.us-east-2.amazonaws.com/ridewise/production:backend-latest
          docker tag ridewise/production/frontend:latest 740186513331.dkr.ecr.us-east-2.amazonaws.com/ridewise/production:frontend-latest

      - name: Push the Image
        run: |
          docker push 740186513331.dkr.ecr.us-east-2.amazonaws.com/ridewise/production:backend-latest
          docker push 740186513331.dkr.ecr.us-east-2.amazonaws.com/ridewise/production:frontend-latest

      - name: Create deployment package
        run: |
          zip -r deployment.zip appspec.yaml deploy/scripts/install_dependencies.sh deploy/scripts/start_application.sh

      - name: Upload to S3
        run: |
          aws s3 cp deployment.zip s3://ridewisebucket/deployment.zip

      - name: Trigger CodeDeploy
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws deploy create-deployment \
            --application-name RideWise-CodeDeploy-Application \
            --deployment-group-name RideWise-CodeDeploy-Group \
            --s3-location bucket=ridewisebucket,key=deployment.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE \
            --description "Deployment From Github Actions"
